[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-townhall"
version = "0.1.0"
description = "Open-source multi-agent Town Hall where AI models debate, pick a 4th guest model by consensus, and produce a full transcript, summary, and conclusion."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[project.scripts]
townhall = "townhall.cli:main"

[tool.setuptools]
packages = ["townhall"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
